<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prism</title>
<link id="prism-theme"  rel="stylesheet" href="theme/default.css">
<link id="prism-layout" rel="stylesheet" href="layout/default.css">
<link rel="stylesheet" href="prism.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

</head>
<body>

<!-- ── Sidebar ──────────────────────────────────────────────────────────── -->
<nav id="sidebar">
  <div class="sidebar-logo">
    <h1>◈ Prism</h1>
    <p>Raw input → focused clarity</p>
  </div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Core</div>
    <div class="nav-item active" data-view="dashboard" onclick="nav(this)">
      <span class="icon">◈</span><span>Front Door</span>
    </div>
    <div class="nav-item" data-view="ingest" onclick="nav(this)">
      <span class="icon">📥</span><span>Ingest</span>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Thought Lenses</div>
    <div class="nav-item" data-view="requirements" onclick="nav(this)">
      <span class="icon">📋</span><span>Requirements</span>
      <span class="badge warn" id="badge-req">–</span>
    </div>
    <div class="nav-item" data-view="hypotheses" onclick="nav(this)">
      <span class="icon">🔬</span><span>Hypotheses</span>
      <span class="badge" id="badge-hyp">–</span>
    </div>
    <div class="nav-item" data-view="rationalizations" onclick="nav(this)">
      <span class="icon">🧩</span><span>Rationalizations</span>
      <span class="badge" id="badge-rat">–</span>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Knowledge Base</div>
    <div class="nav-item" data-view="knowledge" onclick="nav(this)">
      <span class="icon">📚</span><span>Knowledge</span>
    </div>
  </div>

  <div class="sidebar-divider"></div>

  <div class="sidebar-section">
    <div class="sidebar-section-label">Workflows</div>
    <div class="nav-item" data-view="workflows" onclick="nav(this)">
      <span class="icon">⚙️</span><span>Workflows</span>
    </div>
  </div>
</nav>

<!-- ── Main ─────────────────────────────────────────────────────────────── -->
<div id="main">
  <div class="topbar">
    <h2 id="topbar-title">Front Door</h2>
    <button class="btn btn-ghost btn-sm" id="search-open-btn" onclick="openSearchPalette()">
      🔍 Search <span class="kbd-inline">Ctrl K</span>
    </button>
    <div class="topbar-actions" id="topbar-actions"></div>
  </div>
  <div class="content-area" id="content-area">
    <div class="loading-block"><div class="spinner"></div></div>
  </div>
</div>

<!-- ── F5: Search palette (Ctrl+K) ──────────────────────────────────────── -->
<div class="search-overlay" id="search-overlay" style="display:none" onclick="if(event.target===this)closeSearchPalette()">
  <div class="search-palette">
    <div class="search-input-row">
      <span class="search-icon">🔍</span>
      <input id="search-input" type="text" autocomplete="off" spellcheck="false"
        placeholder="Search the vault — lens files, knowledge, workflows, emissions…"
        oninput="_searchOnInput()" onkeydown="_searchOnKeydown(event)">
      <kbd>Esc</kbd>
    </div>
    <div class="search-results" id="search-results"></div>
    <div class="search-footer"><span>↑↓ navigate</span><span>Enter open</span><span>Esc close</span></div>
  </div>
</div>

<div id="toast"></div>

<!-- ── Scripts ──────────────────────────────────────────────────────────── -->
<script src="app.js"></script>
</body>
</html>
