# Prism served by Apache (portability proof — see lenscraft note).
# Caddy remains the reference server; this config proves Prism runs
# identically behind a second lightweight local web service.
#
# Prerequisite (one-time, so www-data can traverse the user's home):
#   sudo setfacl -m u:www-data:x /home/sblanken
# Enable:
#   sudo a2enmod proxy proxy_http && sudo a2enconf prism && sudo systemctl reload apache2

ProxyPreserveHost On

# /prism (no slash) → /prism/ so both spellings work from any client.
RedirectMatch 301 ^/prism$ /prism/

# API first — mod_proxy evaluates before mod_alias, so the more specific
# prefix wins for /prism/api/* and everything else falls through to Alias.
ProxyPass        /prism/api/ http://127.0.0.1:8082/
ProxyPassReverse /prism/api/ http://127.0.0.1:8082/

Alias /prism/ /home/sblanken/workspace/Prism/prism/
<Directory /home/sblanken/workspace/Prism/prism/>
    Options Indexes FollowSymLinks
    AllowOverride None
    Require all granted
</Directory>
